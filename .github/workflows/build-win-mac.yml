---
name: Build - Windows and macOS
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-2025
            qt_version: 6.11.2
          # macOS
          - os: macos-26
            qt_version: 6.11.2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Download dependencies (Windows)
        if: runner.os == 'Windows'
        run: powershell ./setup-deps.ps1

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Qt ARM64 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          arch: win64_msvc2022_arm64_cross_compiled
          version: ${{ matrix.qt_version }}

      - name: Build x64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ matrix.qt_version }}\msvc2022_64\bin

      - name: Build ARM64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release arm64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ matrix.qt_version }}\msvc2022_arm64\bin

      - name: Build Package
        shell: pwsh
        run: |
          if ($Env:RUNNER_OS -eq "Windows") {
            cmd /c scripts\generate-bundle.bat Release
          } else {
            bash scripts/generate-dmg.sh Release
          }

      - name: Prepare fleet release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDirectory = "build/fleet-release"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          $installer = Get-ChildItem "build/installer-Release/MoonlightSetup-*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Moonlight installer was not produced"
          }
          Copy-Item $installer.FullName $releaseDirectory
          $copiedInstaller = Join-Path $releaseDirectory $installer.Name
          $sha256 = (Get-FileHash -Algorithm SHA256 $copiedInstaller).Hash.ToLowerInvariant()
          "$sha256  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path $releaseDirectory "SHA256SUMS.txt")
          [ordered]@{
            version_label = $Env:CI_VERSION
            source_commit = $Env:GITHUB_SHA
            platform = "windows"
            architectures = @("x64", "arm64")
            signed = $false
            installer = $installer.Name
            sha256 = $sha256
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $releaseDirectory "release-manifest.json")

      - name: Prepare fleet release artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fleet-release
          dmg="$(find build/installer-Release -maxdepth 1 -name 'Moonlight-*.dmg' -print -quit)"
          test -n "${dmg}"
          cp "${dmg}" build/fleet-release/
          artifact="$(basename "${dmg}")"
          digest="$(shasum -a 256 "build/fleet-release/${artifact}" | awk '{print $1}')"
          printf '%s  %s\n' "${digest}" "${artifact}" > build/fleet-release/SHA256SUMS.txt
          printf '{\n  "version_label": "%s",\n  "source_commit": "%s",\n  "platform": "macos",\n  "architectures": ["x86_64", "arm64"],\n  "signed": false,\n  "artifact": "%s",\n  "sha256": "%s"\n}\n' \
            "${CI_VERSION}" "${GITHUB_SHA}" "${artifact}" "${digest}" > build/fleet-release/release-manifest.json

      - name: Upload fleet release artifact
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-Fleet-${{ runner.os }}-${{ env.CI_VERSION }}
          path: build/fleet-release/*
          if-no-files-found: error

      - name: Upload Binaries (Windows x64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: Moonlight-${{ runner.os }}-x64-${{ env.CI_VERSION }}
          path: build/deploy-x64-release/*
          if-no-files-found: error

      - name: Upload Binaries (Windows arm64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: Moonlight-${{ runner.os }}-arm64-${{ env.CI_VERSION }}
          path: build/deploy-arm64-release/*
          if-no-files-found: error

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: Moonlight-${{ runner.os }}-${{ env.CI_VERSION }}
          path: build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload Symbols
        uses: actions/upload-artifact@v6
        with:
          name: zDevDbgSyms-${{ runner.os }}-${{ env.CI_VERSION }}
          path: |
            build/installer-*/*.dsym/*
            build/symbols-*/*.pdb
          if-no-files-found: error
