---
name: Build
permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version_label:
        description: Filesystem-safe label for private fleet artifacts
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          REQUESTED_VERSION='${{ inputs.version_label }}'
          if [ -n "${REQUESTED_VERSION}" ]; then
            if ! echo "${REQUESTED_VERSION}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
              echo "version_label must contain only letters, numbers, dots, underscores, and dashes" >&2
              exit 1
            fi
            CI_VERSION="${REQUESTED_VERSION}"
          else
            CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-8`
          fi
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-steamlink:
    needs: setup
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
